name: CI
on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main, codex/layered-test-governance]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-quality-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true
jobs:
  quality-contracts:
    name: Governance quality evidence contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Execute required negative and positive evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --test --test-reporter=tap .github/scripts/quality-evidence.test.mjs | tee evidence/quality.tap
          node .github/scripts/record-quality-evidence.mjs
          node .github/scripts/quality-evidence.mjs evidence/expected.json evidence/report.json
          echo 'Executed governance evidence contracts. Product/formal acceptance NOT_VERIFIED.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quality-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
  result:
    name: CI result
    if: always()
    needs: [quality-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require executed quality suite
        env:
          QUALITY_RESULT: ${{ needs.quality-contracts.result }}
        run: |
          test "$QUALITY_RESULT" = success
          echo 'Governance quality contracts passed; product release acceptance is separate.'
